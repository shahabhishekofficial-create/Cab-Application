name: Driver PWA
on:
  push:
    branches: [main]
    paths: ['apps/driver-pwa/**']
  pull_request:
    paths: ['apps/driver-pwa/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

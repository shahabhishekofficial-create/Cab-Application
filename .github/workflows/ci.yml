name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration numbering
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(find database/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration numbers: $duplicates"
            exit 1
          fi

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package.json
      - run: npm install
      - run: npm run build
      - run: npm test

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package.json
      - run: npm install
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android Gradle project
        run: |
          if [ ! -f gradlew ]; then
            echo 'Gradle wrapper executable is not yet committed; Android build remains gated.'
            exit 0
          fi
          chmod +x gradlew
          ./gradlew assembleDebug
